                        API.use({ gfm: true, breaks: true });
                        API.use(createMathExtension());
                        markedInstance = API;
                    }
                } catch (error) {
                    console.warn("[md-browse] 数学扩展注册失败，退回普通解析：", error);
                    markedInstance = API;
                }
                return markedInstance;
            }

            function parseMarkdown(markdown) {
                var engine = getMarked();
                if (engine) {
                    try {
                        return engine.parse(normalizeDisplayDollars(markdown));
                    } catch (error) {
                        console.warn("[md-browse] marked 解析失败，降级为纯文本：", error);
                    }
                }
                var pre = document.createElement("pre");
                pre.textContent = markdown;
                return pre.outerHTML;
            }

            /**
             * 把独占一行的单个 $ 规范化成 $$（数学解法.md 就是这种写法）。
             * 只有整行就是一个 $ 时才替换，代码围栏内部不动。
             */
            function normalizeDisplayDollars(markdown) {
                if (markdown.indexOf("$") < 0) return markdown;
                var lines = String(markdown).replace(/\r\n?/g, "\n").split("\n");
                var fenced = false;
                for (var i = 0; i < lines.length; i += 1) {
                    var line = lines[i];
                    if (/^\s*(?:```|~~~)/.test(line)) {
                        fenced = !fenced;
                        continue;
                    }
                    if (fenced) continue;
                    var standalone = /^(\s*)\$\s*$/.exec(line);
                    if (standalone) lines[i] = standalone[1] + "$$";
                }
                return lines.join("\n");
            }

            /** 渲染公式；单个公式出错只影响它自己，并在旁边标出错误 */
            function renderMathIn(container) {
                var nodes = container.querySelectorAll(".katex-wrap, .katex-block");
                if (!nodes.length) return;
                if (!window.katex || typeof window.katex.render !== "function") {
                    console.warn("[md-browse] KaTeX 未加载，公式保持源码显示");
                    return;
                }
                Array.prototype.forEach.call(nodes, function (node) {
                    var source = node.textContent;
                    var display = node.getAttribute("data-display") === "1";
                    try {
                        window.katex.render(source, node, {
                            displayMode: display,
                            throwOnError: false,
                            strict: "ignore",
                            trust: false,
                            errorColor: "#d1242f"
                        });
                    } catch (error) {
                        node.textContent = source;
                        node.classList.add("katex-error");
                        node.setAttribute("title", "公式渲染失败：" + (error && error.message ? error.message : error));
                        console.warn("[md-browse] 公式渲染失败：", source, error);
                    }
                });
            }

            /* ------------------------- mermaid 图表 ------------------------- */

            var MERMAID_CDN = "https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js";
            var mermaidPromise = null;
            var mermaidReady = false;
            var mermaidTheme = null;

            function injectScript(src) {
                return new Promise(function (resolve, reject) {
                    var script = document.createElement("script");
                    script.src = src;
                    script.async = true;
                    script.onload = function () { resolve(); };
                    script.onerror = function () { reject(new Error("无法加载 " + src)); };
                    document.head.appendChild(script);
                });
            }

            function prefersDark() {
                return Boolean(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
            }

            function currentMermaidTheme() {
                return prefersDark() ? "dark" : "default";
            }

            /** mermaid 体积很大，只有文档里真的出现图表时才加载 */
            function ensureMermaid() {
                if (mermaidPromise) return mermaidPromise;
                mermaidPromise = injectScript(MERMAID_CDN).then(function () {
                    if (!window.mermaid) throw new Error("mermaid 未就绪");
                    try {
                        window.mermaid.initialize({
                            startOnLoad: false,
                            securityLevel: "strict",
                            theme: currentMermaidTheme(),
                            fontFamily: "inherit",
                            flowchart: { useMaxWidth: true, htmlLabels: false },
                            sequence: { useMaxWidth: true },
                            gantt: { useMaxWidth: true }
                        });
                        mermaidReady = true;
                        mermaidTheme = currentMermaidTheme();
                    } catch (error) {
                        console.warn("[md-browse] mermaid 初始化失败：", error);
                        throw error;
                    }
                    return window.mermaid;
                }).catch(function (error) {
                    mermaidPromise = null; // 允许下次重试
                    throw error;
                });
                return mermaidPromise;
            }

            function markMermaidFailure(node, message) {
                node.classList.remove("mermaid");
                node.classList.add("mermaid-failed");
                node.setAttribute("title", message);
            }

            function renderMermaidIn(container) {
                var nodes = container.querySelectorAll("pre > code.language-mermaid, div.language-mermaid");
                if (!nodes.length) return;
                var sources = [];
                var targets = [];
                Array.prototype.forEach.call(nodes, function (node) {
                    var source = (node.textContent || "").trim();
                    if (!source) return;
                    var figure = document.createElement("figure");
                    figure.className = "mermaid-figure";
                    var body = document.createElement("div");
                    body.className = "mermaid";
                    body.textContent = source;
                    var caption = document.createElement("div");
                    caption.className = "mermaid-loading";
                    caption.textContent = "正在渲染图表…";
                    figure.appendChild(body);
                    figure.appendChild(caption);
                    var host = node.closest("pre") || node;
                    host.parentNode.replaceChild(figure, host);
                    sources.push(source);
                    targets.push({ body: body, caption: caption, source: source, figure: figure });
                });
                if (!sources.length) return;

                ensureMermaid().then(function (mermaid) {
                    targets.forEach(function (item) {
                        try {
                            mermaid.render("mmd-" + Math.random().toString(36).slice(2, 10), item.source).then(function (result) {
                                item.body.innerHTML = result.svg;
                                item.caption.remove();
                            }).catch(function (error) {
                                item.caption.remove();
                                markMermaidFailure(item.body, String(error && error.message ? error.message : error));
                            });
                        } catch (error) {
                            item.caption.remove();
                            markMermaidFailure(item.body, String(error && error.message ? error.message : error));
                        }
                    });
                }).catch(function (error) {
                    console.warn("[md-browse] mermaid 加载失败：", error);
                    targets.forEach(function (item) {
                        item.caption.textContent = "图表无法渲染：mermaid 资源加载失败（离线或被拦截）";
                    });
                });
            }

            /** 系统深浅色变化时整篇重渲染，让图表配色跟着变 */
            function watchColorScheme() {
                if (!window.matchMedia || typeof window.matchMedia !== "function") return;
                var query = window.matchMedia("(prefers-color-scheme: dark)");
                if (typeof query.addEventListener !== "function") return;
                query.addEventListener("change", function () {
                    if (mermaidTheme === currentMermaidTheme()) return;
                    mermaidTheme = currentMermaidTheme();
                    if (!mermaidReady) return;
                    if (!state.current || typeof state.lastMarkdown !== "string") return;
                    // 文档里没有图表就不用折腾
                    if (!/```mermaid/.test(state.lastMarkdown)) return;
                    var anchor = currentAnchorId();
                    renderDocument(state.current, state.lastMarkdown, anchor || "");
                });
            }

            /** 当前视口顶部附近的小节 id，用于重渲染后回到原位 */
            function currentAnchorId() {
                var headings = contentEl.querySelectorAll("h1[id], h2[id], h3[id], h4[id]");
                var best = "";
                Array.prototype.forEach.call(headings, function (heading) {
                    if (heading.getBoundingClientRect().top <= 120) best = heading.id;
                });
                return best;
            }

            function sanitize(html) {
                if (!window.DOMPurify) return html;
                return window.DOMPurify.sanitize(html, {
                    USE_PROFILES: { html: true },
                    ADD_ATTR: ["target", "rel", "id", "class", "title", "align", "colspan", "rowspan"],
                    FORBID_TAGS: ["style", "form", "input", "iframe", "object", "embed"],
                    FORBID_ATTR: ["style", "onerror", "onload", "onclick"]
                });
            }

            var SAFE_PROTOCOL = /^(?:https?:|mailto:|tel:|#|\/|\.\/|\.\.\/)/i;

            function rewriteLinks(container, fromFile) {
                var anchors = container.querySelectorAll("a[href]");
                Array.prototype.forEach.call(anchors, function (anchor) {
                    var href = anchor.getAttribute("href") || "";
                    var value = decodeEntities(href.trim());
                    if (!SAFE_PROTOCOL.test(value)) {
                        anchor.setAttribute("href", "#");
                        anchor.setAttribute("data-unsafe", "1");
                        return;
                    }
                    if (value.charAt(0) === "#") {
                        var inDoc = value.slice(1);
                        if (!inDoc) return;
                        anchor.setAttribute("href", "#" + inDoc);
                        anchor.setAttribute("data-anchor", decodeURIComponent(inDoc));
                        return;
                    }
                    if (/^(?:https?:)?\/\//i.test(value) || /^mailto:/i.test(value) || /^tel:/i.test(value)) {
                        anchor.setAttribute("target", "_blank");
                        anchor.setAttribute("rel", "noopener noreferrer");
                        anchor.classList.add("external");
                        return;
                    }
                    var parts = value.split("#");
                    var target = parts[0];
                    var anchorName = parts.length > 1 ? decodeURIComponent(parts.slice(1).join("#")) : "";
                    if (!target) return;
                    var path = resolveHref(fromFile, target);
                    if (!path) return;
                    if (/\.(md|markdown)$/i.test(path)) {
                        anchor.setAttribute("href", hashFor(path, anchorName));
                        anchor.setAttribute("data-doc", path);
                        if (anchorName) anchor.setAttribute("data-anchor", anchorName);
                        return;
                    }
                    // 非 Markdown 资源（PDF / 图片等）
                    anchor.setAttribute("href", toSiteUrl(target));
                    anchor.setAttribute("target", "_blank");
                    anchor.setAttribute("rel", "noopener");
                    anchor.classList.add("asset-link");
                });

                var images = container.querySelectorAll("img[src]");
                Array.prototype.forEach.call(images, function (image) {
                    var src = decodeEntities((image.getAttribute("src") || "").trim());
                    if (!src || /^(?:https?:)?\/\//i.test(src) || /^data:/i.test(src)) return;
                    var path = resolveHref(fromFile, src);
                    if (path) image.setAttribute("src", encodePath(path));
                });
            }

            function decorateHeadings(container, fromFile) {
                var used = {};
                var headings = container.querySelectorAll("h1, h2, h3, h4, h5, h6");
                Array.prototype.forEach.call(headings, function (heading) {
                    var text = (heading.textContent || "").trim();
                    heading.setAttribute("data-heading", text);
                    var base = slugify(text) || "section";
                    var id = base;
                    var index = used[base] = (used[base] === undefined ? 0 : used[base] + 1);
                    if (index) id = base + "-" + index;
                    heading.id = id;

                    var link = document.createElement("a");
                    link.className = "anchor";
                    link.href = hashFor(fromFile, id);
                    link.setAttribute("data-anchor", id);
                    link.setAttribute("data-doc", fromFile);
                    link.setAttribute("title", "复制本小节链接");
                    link.setAttribute("aria-label", "复制本小节链接");
                    link.textContent = "#";
                    heading.appendChild(link);
                });
            }

            function decorateCode(container) {
                var blocks = container.querySelectorAll("pre > code");
                Array.prototype.forEach.call(blocks, function (code) {
                    // mermaid 源码块要交给图表渲染，不做高亮也不加复制按钮
                    if (code.classList.contains("language-mermaid")) return;
                    if (window.hljs) {
                        try { window.hljs.highlightElement(code); } catch (error) { /* 忽略高亮错误 */ }
                    }
                    var pre = code.parentElement;
                    if (!pre || pre.querySelector(".copy-code")) return;
                    var button = document.createElement("button");
                    button.type = "button";
                    button.className = "copy-code";
                    button.textContent = "复制";
                    button.addEventListener("click", function () {
                        var text = code.textContent || "";
                        var done = function () {
                            button.textContent = "已复制";
                            setTimeout(function () { button.textContent = "复制"; }, 1500);
                        };
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text, done); });
                        } else {
                            fallbackCopy(text, done);
                        }
                    });
                    pre.appendChild(button);
                });
            }

            function fallbackCopy(text, done) {
                var area = document.createElement("textarea");
                area.value = text;
                area.setAttribute("readonly", "");
                area.style.position = "fixed";
                area.style.opacity = "0";
                document.body.appendChild(area);
                area.select();
                try { document.execCommand("copy"); done(); } catch (error) { /* 忽略 */ }
                document.body.removeChild(area);
            }

            /** 锚点匹配：先精确 id，再按宽松键比对，兼顾大小写与标点差异 */
            function findHeading(container, anchor) {
                if (!anchor) return null;
                var byId = null;
                try { byId = container.querySelector("#" + CSS.escape(anchor)); } catch (error) { byId = null; }
                if (!byId) {
                    try { byId = document.getElementById(anchor); } catch (error) { byId = null; }
                }
                if (byId) return byId;
                var target = looseKey(anchor);
                var headings = container.querySelectorAll("h1, h2, h3, h4, h5, h6");
                var found = null;
                Array.prototype.forEach.call(headings, function (heading) {
                    if (found) return;
                    if (looseKey(heading.textContent || "") === target) found = heading;
                });
                return found;
            }

            function scrollToAnchor(anchor, smooth) {
                var node = findHeading(contentEl, anchor);
                if (!node) return false;
                node.scrollIntoView({ behavior: smooth ? "smooth" : "auto", block: "start" });
                node.classList.add("flash");
                setTimeout(function () { node.classList.remove("flash"); }, 900);
                return true;
            }

            function renderToc(fromFile) {
                var headings = contentEl.querySelectorAll("h2[id], h3[id], h4[id]");
                if (headings.length < 3) {
                    tocEl.hidden = true;
                    tocEl.innerHTML = "";
                    return;
                }
                var html = ["<h2>本文目录</h2>"];
                Array.prototype.forEach.call(headings, function (heading) {
                    var level = Number(heading.tagName.slice(1));
                    var text = (heading.getAttribute("data-heading") || heading.textContent || "").trim();
                    html.push('<a class="lv' + level + '" href="' + hashFor(fromFile, heading.id) +
                        '" data-anchor="' + escapeHtml(heading.id) + '" data-doc="' + escapeHtml(fromFile) +
                        '" title="' + escapeHtml(text) + '">' + escapeHtml(text) + "</a>");
                });
                tocEl.innerHTML = html.join("");
                tocEl.hidden = false;
            }

            /* ============================ 文档加载 ============================ */

            function setLoading(file) {
                titleEl.textContent = stripExt(baseName(file));
                crumbEl.textContent = file;
                contentEl.innerHTML = '<div class="skeleton">' +
                    '<span></span><span></span><span></span><span></span><span></span><span></span></div>';
                tocEl.hidden = true;
            }

            function candidatePaths(file) {
                var canonical = resolveDocName(file) || file;
                var candidates = [canonical];
                var encoded = encodePath(canonical);
                if (encoded !== canonical) candidates.push(encoded);
                try {
                    var decoded = decodeURIComponent(canonical);
                    if (decoded !== canonical) {
                        candidates.push(decoded);
                        if (encodePath(decoded) !== canonical) candidates.push(encodePath(decoded));
                    }
                } catch (error) { /* 非法编码，忽略 */ }
                var normalized = canonical.normalize ? canonical.normalize("NFC") : canonical;
                if (normalized !== canonical) {
                    candidates.push(normalized);
                    candidates.push(encodePath(normalized));
                }
                return candidates.filter(function (item, index) {
                    return item && candidates.indexOf(item) === index;
                });
            }

            function fetchDocument(file) {
                var candidates = candidatePaths(file);
                var lastError = null;
                var chain = Promise.reject(new Error("no-candidate"));
                candidates.forEach(function (path, index) {
                    chain = chain.catch(function () {
                        if (index > 0) console.warn("[md-browse] 尝试备用路径：" + path);
                        return fetch(path, { cache: "no-cache" }).then(function (response) {
                            if (!response.ok) throw new Error(response.status + " " + response.statusText);
                            return response.text();
                        });
                    });
                });
                chain = chain.catch(function (error) {
                    lastError = error;
                    return null;
                });
                return chain.then(function (markdown) {
                    if (markdown === null) throw lastError || new Error("加载失败");
                    return markdown;
                });
            }

            function showError(file, error) {
                var candidates = candidatePaths(file);
                var message;
                if (location.protocol === "file:") {
                    message = "<h3>无法在本地直接打开</h3><p>浏览器禁止 <code>file://</code> 页面读取同目录文件。" +
                        "请在仓库目录下启动一个本地静态服务器后访问，例如：</p>" +
                        "<ul><li><code>python -m http.server 8000</code></li>" +
                        "<li><code>npx serve .</code></li>" +
                        "<li>VS Code 的 Live Server 插件</li></ul>";
                } else {
                    message = "<h3>读取文档失败</h3><p>路径：<code>" + escapeHtml(file) + "</code><br>" +
                        "原因：" + escapeHtml(error && error.message ? error.message : String(error)) + "</p>" +
                        "<ul><li>确认该文件已经推送到仓库的部署分支（工作流只在推送后重新生成清单）。</li>" +
                        "<li>若文件名含空格或中文，可尝试下方备用地址。</li></ul>";
                }
                var links = candidates.slice(0, 4).map(function (path) {
                    return '<a href="' + encodePath(path) + '" target="_blank" rel="noopener">' + escapeHtml(path) + "</a>";
                }).join("");
                var gh = rawUrl(file) ? '<a href="' + rawUrl(file) + '" target="_blank" rel="noopener">在 GitHub 查看</a>' : "";
                var api = state.meta && state.meta.owner
                    ? '<button type="button" id="notice-refresh">从 GitHub API 刷新清单</button>' : "";
                contentEl.innerHTML = '<div class="notice">' + message +
                    '<div class="actions">' + links + gh + api + "</div></div>";
                tocEl.hidden = true;
            }

            function renderDocument(file, markdown, anchor) {
                var html = sanitize(parseMarkdown(markdown));
                contentEl.innerHTML = html;
                state.lastMarkdown = markdown;

                var doc = state.byFile[file];
                var firstHeading = contentEl.querySelector("h1, h2");
                var title = doc && doc.title ? doc.title : (firstHeading ? firstHeading.textContent : stripExt(baseName(file)));
                titleEl.textContent = title.replace(/#$/, "").trim();
                crumbEl.textContent = file;
                document.title = title + " · " + (state.meta && state.meta.name ? state.meta.name : "考研复习");

                decorateHeadings(contentEl, file);
                rewriteLinks(contentEl, file);
                decorateCode(contentEl);
                // 先渲染公式，再交给 mermaid：图表里的公式标签也能正常显示
                renderMathIn(contentEl);
                renderMermaidIn(contentEl);
                renderToc(file);
                markActive();

                if (anchor) {
                    // 渲染后立刻跳转；字体/图片延迟布局时再补一次
                    if (!scrollToAnchor(anchor, false)) {
                        setTimeout(function () { scrollToAnchor(anchor, false); }, 80);
                    }
                } else {
                    window.scrollTo({ top: 0, behavior: "auto" });
                }
            }

            function openDoc(file, anchor, options) {
                options = options || {};
                var canonical = resolveDocName(file);
                if (!canonical) {
                    if (options.silent) return;
                    titleEl.textContent = stripExt(baseName(file));
                    crumbEl.textContent = file;
                    showError(file, new Error("文档不在清单中"));
                    return;
                }
                state.current = canonical;
                markActive();
                if (!options.skipHash) pushHash(canonical, anchor || "");
                setLoading(canonical);
                var token = String(Date.now()) + Math.random();
                state.token = token;
                fetchDocument(canonical).then(function (markdown) {
                    if (state.token !== token) return;
                    renderDocument(canonical, markdown, anchor);
                }).catch(function (error) {
                    if (state.token !== token) return;
                    console.error("[md-browse] 加载失败：", error);
                    showError(canonical, error);
                });
            }

            function applyRoute() {
                var route = parseHash();
                if (!route.doc) {
                    var first = state.documents[0];
                    if (first) return openDoc(first.file, "", { replace: true });
                    return;
                }
                var canonical = resolveDocName(route.doc);
                if (!canonical) {
                    // 允许直接手写清单外的文件名（例如刚推送还没重新部署）
                    openDoc(route.doc, route.anchor, { skipHash: false });
                    return;
                }
                if (canonical === state.current && document.readyState !== "loading") {
                    if (route.anchor) scrollToAnchor(route.anchor, true);
                    return;
                }
                openDoc(canonical, route.anchor, { silent: false });
            }

            /* ============================ 交互绑定 ============================ */

            function closeSidebarOnMobile() {
                if (window.matchMedia("(max-width: 820px)").matches) {
                    layout.classList.remove("sidebar-open");
                }
            }

            function bind() {
                var toggle = $("sidebar-toggle");
                toggle.addEventListener("click", function () {
                    if (window.matchMedia("(max-width: 820px)").matches) {
                        var open = layout.classList.toggle("sidebar-open");
                        $("backdrop").hidden = !open;
                    } else {
                        state.sidebarCollapsed = layout.classList.toggle("sidebar-collapsed");
                        toggle.setAttribute("aria-expanded", String(!state.sidebarCollapsed));
                    }
                });

                $("backdrop").addEventListener("click", function () {
                    layout.classList.remove("sidebar-open");
                });

                listEl.addEventListener("click", function (event) {
                    var button = event.target.closest(".doc-link");
                    if (!button) return;
                    openDoc(button.getAttribute("data-file"), "");
                    closeSidebarOnMobile();
                });

                contentEl.addEventListener("click", function (event) {
                    var copy = event.target.closest(".copy-code");
                    if (copy) return; // 由装饰阶段单独绑定
                    var refresh = event.target.closest("#notice-refresh");
                    if (refresh) {
                        refresh.disabled = true;
                        refresh.textContent = "正在读取…";
                        discoverViaGitHubApi().then(function (raw) {
                            if (!raw) {
                                refresh.textContent = "读取失败（可能限流）";
                                return;
                            }
                            applyManifest(raw);
                            renderList();
                            refresh.textContent = "已刷新（" + state.documents.length + " 篇）";
                            if (state.current) openDoc(state.current, "", { skipHash: true });
                        });
                        return;
                    }
                    var link = event.target.closest("a[href]");
                    if (!link) return;
                    if (link.getAttribute("data-unsafe")) {
                        event.preventDefault();
                        alert("该链接的协议不在白名单内，已阻止跳转。");
                        return;
                    }
                    var doc = link.getAttribute("data-doc");
                    var anchor = link.getAttribute("data-anchor") || "";
                    if (doc) {
                        event.preventDefault();
                        if (doc === state.current) {
                            if (anchor) {
                                pushHash(doc, anchor);
                                scrollToAnchor(anchor, true);
                            }
                            return;
                        }
                        openDoc(doc, anchor);
                        closeSidebarOnMobile();
                        return;
                    }
                    if (anchor) {
                        event.preventDefault();
                        pushHash(state.current, anchor);
                        scrollToAnchor(anchor, true);
                    }
                });

                tocEl.addEventListener("click", function (event) {
                    var link = event.target.closest("a[data-anchor]");
                    if (!link) return;
                    event.preventDefault();
                    var anchor = link.getAttribute("data-anchor");
                    pushHash(state.current, anchor);
                    scrollToAnchor(anchor, true);
                });

                searchEl.addEventListener("input", debounce(function () {
                    state.query = searchEl.value;
                    searchWrap.classList.toggle("has-value", Boolean(searchEl.value));
                    renderList();
                }, 120));

                searchEl.addEventListener("keydown", function (event) {
                    if (event.key === "Escape") {
                        searchEl.value = "";
                        state.query = "";
                        searchWrap.classList.remove("has-value");
                        renderList();
                    }
                    if (event.key === "Enter") {
                        var first = listEl.querySelector(".doc-link");
                        if (first) {
                            openDoc(first.getAttribute("data-file"), "");
                            closeSidebarOnMobile();
                        }
                    }
                });

                $("search-clear").addEventListener("click", function () {
                    searchEl.value = "";
                    state.query = "";
                    searchWrap.classList.remove("has-value");
                    renderList();
                    searchEl.focus();
                });

                $("search-jump").addEventListener("click", function () {
                    layout.classList.remove("sidebar-collapsed");
                    layout.classList.add("sidebar-open");
                    searchEl.focus();
                    searchEl.select();
                });

                $("print-doc").addEventListener("click", function () { window.print(); });

                $("reload-index").addEventListener("click", function () {
                    var button = this;
                    button.disabled = true;
                    discoverViaGitHubApi().then(function (raw) {
                        if (!raw) {
                            alert("未能从 GitHub API 读取目录树（可能未部署到 GitHub Pages，或触发了 API 限流）。\n" +
                                "清单会在每次推送后由工作流重新生成。");
                        } else {
                            applyManifest(raw);
                            renderList();
                            markActive();
                        }
                        button.disabled = false;
                    });
                });

                document.addEventListener("keydown", function (event) {
                    var tag = (event.target.tagName || "").toLowerCase();
                    var typing = tag === "input" || tag === "textarea" || event.target.isContentEditable;
                    if (event.key === "/" && !typing) {
                        event.preventDefault();
                        layout.classList.remove("sidebar-collapsed");
                        layout.classList.add("sidebar-open");
                        searchEl.focus();
                    }
                    if (event.key === "b" && !typing && !event.metaKey && !event.ctrlKey) {
                        layout.classList.toggle("sidebar-collapsed");
                    }
                    if (event.key === "Escape") {
                        layout.classList.remove("sidebar-open");
                    }
                });

                window.addEventListener("hashchange", applyRoute);
                window.addEventListener("popstate", applyRoute);
            }

            /* ============================ 启动 ============================ */

            /** 清单缺失时的静默兜底：直接问 GitHub 要一份目录树 */
            function tryAutoDiscover() {
                if (location.protocol === "file:") return;
                discoverViaGitHubApi().then(function (raw) {
                    if (!raw) return;
                    applyManifest(raw);
                    renderList();
                    markActive();
                    console.info("[md-browse] 已通过 GitHub API 补全清单：" +
                        state.documents.length + " 篇文档。");
                    if (!state.current && state.documents.length) openDoc(state.documents[0].file, "");
                });
            }

            function boot() {
                var raw = window.__MD_INDEX__ || null;
                var usedFallback = false;
                if (!raw) {
                    console.info("[md-browse] 未找到 md-index.js，先使用内置清单；" +
                        "若部署在 GitHub Pages 上，将尝试直接读取仓库目录树。");
                    usedFallback = true;
                }
                applyManifest(raw);
                renderList();
                bind();
                watchColorScheme();
                if (usedFallback) tryAutoDiscover();
                var route = parseHash();
                if (!route.doc && state.documents.length) {
                    // 首次进入：定位到最近一次阅读的文档，否则用第一篇
                    var remembered = null;
                    try { remembered = localStorage.getItem("md-browse:last"); } catch (error) { remembered = null; }
                    if (remembered && resolveDocName(remembered)) {
                        var anchor = "";
                        try { anchor = localStorage.getItem("md-browse:anchor") || ""; } catch (error) { anchor = ""; }
                        openDoc(remembered, anchor);
                        return;
                    }
                }
                applyRoute();
            }

            window.addEventListener("beforeunload", function () {
                try {
                    if (state.current) localStorage.setItem("md-browse:last", state.current);
                } catch (error) { /* 忽略 */ }
            });

            // 记住每篇文档的滚动锚点，返回时直接续读
            window.addEventListener("scroll", debounce(function () {
                if (!state.current) return;
                var headings = contentEl.querySelectorAll("h1[id], h2[id], h3[id]");
                var best = null;
                Array.prototype.forEach.call(headings, function (heading) {
                    if (heading.getBoundingClientRect().top <= 100) best = heading;
                });
                if (best) {
                    try { localStorage.setItem("md-browse:anchor", best.id); } catch (error) { /* 忽略 */ }
                }
            }, 400), { passive: true });

            if (document.readyState === "loading") {
                document.addEventListener("DOMContentLoaded", boot);
            } else {
                boot();
            }
        })();
    </script>
</body>
</html>

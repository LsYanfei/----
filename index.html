<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>考研复习 · 文档浏览</title>

    <!-- Markdown 解析与净化 -->
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.11/dist/purify.min.js"></script>
    <!-- 数学公式：KaTeX（含 mhchem 化学式、copy-tex 复制保留源码） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/mhchem.min.js"></script>
    <!-- auto-render 只为给 copy-tex 提供 renderMathInElement 钩子（复制公式时保留 LaTeX 源码） -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/copy-tex.min.js"></script>
    <!-- 代码高亮（可选，加载失败会自动降级为纯文本代码块） -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <!-- mermaid 图表体积较大，仅在文档里真的出现图表时才按需加载（见 ensureMermaid） -->

    <!-- 部署时由 .github/workflows/static.yml 生成；本地没有该文件时会自动使用内置清单 -->
    <script src="./md-index.js" onerror="window.__MD_INDEX_MISSING__ = true"></script>

    <style>
        :root {
            --bg: #ffffff;
            --bg-soft: #f7f8fa;
            --bg-elev: #ffffff;
            --text: #1f2328;
            --text-soft: #59636e;
            --text-faint: #818b98;
            --border: #d8dee4;
            --border-soft: #e6eaef;
            --accent: #b42318;
            --accent-soft: #fdf2f0;
            --code-bg: #f2f4f7;
            --mark: #fff3bf;
            --shadow: 0 1px 2px rgba(31, 35, 40, .08), 0 6px 20px rgba(31, 35, 40, .06);
            --sidebar-w: 272px;
            --toc-w: 220px;
            --radius: 10px;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #10151b;
                --bg-soft: #151b22;
                --bg-elev: #171e26;
                --text: #e6edf3;
                --text-soft: #9aa7b4;
                --text-faint: #6e7d8c;
                --border: #2b343d;
                --border-soft: #232b34;
                --accent: #ff8a7a;
                --accent-soft: #2a1b19;
                --code-bg: #1c242d;
                --mark: #4d4213;
                --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 6px 20px rgba(0, 0, 0, .35);
            }

            .hljs {
                background: transparent !important;
            }
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Source Han Sans SC", "Noto Sans CJK SC", sans-serif;
            font-size: 16px;
            line-height: 1.75;
            -webkit-text-size-adjust: 100%;
        }

        button {
            font: inherit;
            color: inherit;
        }

        /* ---------- 顶栏 ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            gap: 10px;
            height: 54px;
            padding: 0 14px;
            background: color-mix(in srgb, var(--bg) 88%, transparent);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
        }

        .topbar .brand {
            font-weight: 700;
            font-size: 15px;
            letter-spacing: .02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .topbar .spacer {
            flex: 1;
        }

        .icon-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 34px;
            height: 34px;
            padding: 0 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-elev);
            cursor: pointer;
            transition: background .15s, border-color .15s;
        }

        .icon-btn:hover {
            background: var(--bg-soft);
            border-color: var(--text-faint);
        }

        .icon-btn[aria-pressed="true"] {
            background: var(--accent-soft);
            border-color: var(--accent);
            color: var(--accent);
        }

        .icon-btn .label {
            font-size: 13px;
        }

        /* ---------- 布局 ---------- */
        .layout {
            display: grid;
            grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
            min-height: calc(100vh - 54px);
        }

        .layout.sidebar-collapsed {
            grid-template-columns: 0 minmax(0, 1fr);
        }

        .layout.sidebar-collapsed .sidebar {
            visibility: hidden;
            opacity: 0;
        }

        /* ---------- 侧边栏 ---------- */
        .sidebar {
            position: sticky;
            top: 54px;
            align-self: start;
            height: calc(100vh - 54px);
            overflow: auto;
            border-right: 1px solid var(--border);
            background: var(--bg-soft);
            transition: opacity .15s;
        }

        .sidebar-inner {
            padding: 12px 10px 40px;
        }

        .search-wrap {
            position: relative;
            margin-bottom: 10px;
        }

        .search-wrap input {
            width: 100%;
            height: 34px;
            padding: 0 30px 0 30px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-elev);
            color: var(--text);
            font-size: 14px;
            outline: none;
        }

        .search-wrap input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-soft);
        }

        .search-wrap .icon {
            position: absolute;
            top: 8px;
            left: 9px;
            color: var(--text-faint);
            font-size: 13px;
            pointer-events: none;
        }

        .search-wrap .clear {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 26px;
            height: 26px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: var(--text-faint);
            cursor: pointer;
            display: none;
        }

        .search-wrap.has-value .clear {
            display: block;
        }

        .group {
            margin: 0 0 12px;
        }

        .group>h2 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 12px 0 6px;
            padding: 0 8px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .doc-link {
            display: block;
            width: 100%;
            padding: 7px 10px;
            border: 0;
            border-left: 2px solid transparent;
            border-radius: 0 8px 8px 0;
            background: transparent;
            text-align: left;
            font-size: 14px;
            line-height: 1.45;
            cursor: pointer;
            color: var(--text-soft);
        }

        .doc-link:hover {
            background: var(--bg-elev);
            color: var(--text);
        }

        .doc-link.active {
            background: var(--bg-elev);
            border-left-color: var(--accent);
            color: var(--accent);
            font-weight: 600;
        }

        .doc-link .meta {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            font-weight: 400;
            color: var(--text-faint);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .doc-link mark,
        .empty mark {
            background: var(--mark);
            color: inherit;
            border-radius: 2px;
        }

        .sidebar-foot {
            margin: 16px 8px 0;
            padding-top: 10px;
            border-top: 1px dashed var(--border);
            font-size: 11px;
            line-height: 1.7;
            color: var(--text-faint);
        }

        .sidebar-foot a {
            color: var(--text-soft);
        }

        .empty {
            padding: 24px 10px;
            text-align: center;
            font-size: 13px;
            color: var(--text-faint);
        }

        /* ---------- 正文区 ---------- */
        .main {
            min-width: 0;
            display: flex;
            justify-content: center;
            gap: 28px;
            padding: 26px 28px 80px;
        }

        .article-wrap {
            min-width: 0;
            width: 100%;
            max-width: 860px;
        }

        .toc {
            position: sticky;
            top: 78px;
            align-self: start;
            width: var(--toc-w);
            max-height: calc(100vh - 110px);
            overflow: auto;
            padding-left: 12px;
            border-left: 1px solid var(--border-soft);
            font-size: 13px;
        }

        .toc h2 {
            margin: 0 0 6px;
            font-size: 11px;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--text-faint);
        }

        .toc a {
            display: block;
            padding: 3px 0;
            color: var(--text-soft);
            text-decoration: none;
            line-height: 1.5;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc a:hover {
            color: var(--accent);
        }

        .toc a.lv3 {
            padding-left: 12px;
            font-size: 12px;
        }

        .toc a.lv4 {
            padding-left: 24px;
            font-size: 12px;
        }

        .breadcrumb {
            margin: 0 0 4px;
            font-size: 12px;
            color: var(--text-faint);
            word-break: break-all;
        }

        .doc-title {
            margin: 0 0 20px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
            font-size: 28px;
            line-height: 1.35;
            font-weight: 750;
        }

        .notice {
            padding: 14px 16px;
            border: 1px solid var(--border);
            border-left: 4px solid var(--accent);
            border-radius: var(--radius);
            background: var(--bg-soft);
            font-size: 14px;
        }

        .notice h3 {
            margin: 0 0 8px;
            font-size: 15px;
        }

        .notice ul {
            margin: 8px 0 0;
            padding-left: 20px;
        }

        .notice code {
            background: var(--code-bg);
            padding: 1px 5px;
            border-radius: 4px;
            font-size: 13px;
        }

        .notice .actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .notice .actions a,
        .notice .actions button {
            display: inline-block;
            padding: 5px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-elev);
            color: var(--text);
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
        }

        /* 骨架屏 */
        .skeleton span {
            display: block;
            height: 14px;
            margin-bottom: 12px;
            border-radius: 6px;
            background: linear-gradient(90deg, var(--bg-soft), var(--border-soft), var(--bg-soft));
            background-size: 200% 100%;
            animation: shimmer 1.2s linear infinite;
        }

        .skeleton span:nth-child(2n) {
            width: 78%;
        }

        .skeleton span:nth-child(3n) {
            width: 88%;
        }

        @keyframes shimmer {
            from {
                background-position: 200% 0;
            }

            to {
                background-position: -200% 0;
            }
        }

        /* ---------- Markdown 排版 ---------- */
        .md-body {
            word-wrap: break-word;
        }

        .md-body>:first-child {
            margin-top: 0;
        }

        .md-body h1,
        .md-body h2,
        .md-body h3,
        .md-body h4,
        .md-body h5,
        .md-body h6 {
            margin: 1.8em 0 .7em;
            line-height: 1.35;
            font-weight: 700;
            scroll-margin-top: 72px;
        }

        .md-body h1 {
            font-size: 1.6em;
            padding-bottom: .3em;
            border-bottom: 1px solid var(--border-soft);
        }

        .md-body h2 {
            font-size: 1.34em;
            padding-bottom: .25em;
            border-bottom: 1px solid var(--border-soft);
        }

        .md-body h3 {
            font-size: 1.15em;
        }

        .md-body h4 {
            font-size: 1.02em;
        }

        .md-body p,
        .md-body ul,
        .md-body ol,
        .md-body blockquote,
        .md-body table,
        .md-body pre {
            margin: 0 0 1em;
        }

        .md-body ul,
        .md-body ol {
            padding-left: 1.6em;
        }

        .md-body li {
            margin: .25em 0;
        }

        .md-body li>ul,
        .md-body li>ol {
            margin: .25em 0;
        }

        .md-body a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
        }

        .md-body a:hover {
            border-bottom-color: var(--accent);
        }

        .md-body blockquote {
            padding: .2em 1em;
            border-left: 4px solid var(--border);
            background: var(--bg-soft);
            border-radius: 0 var(--radius) var(--radius) 0;
            color: var(--text-soft);
        }

        .md-body blockquote>:last-child {
            margin-bottom: 0;
        }

        .md-body code {
            padding: .15em .4em;
            border-radius: 5px;
            background: var(--code-bg);
            font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
            font-size: .885em;
        }

        .md-body pre {
            position: relative;
            overflow: auto;
            padding: 14px 16px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--code-bg);
            line-height: 1.6;
        }

        .md-body pre code {
            padding: 0;
            background: transparent;
            font-size: .875em;
        }

        .md-body table {
            display: block;
            width: max-content;
            max-width: 100%;
            overflow: auto;
            border-collapse: collapse;
            font-size: .95em;
        }

        .md-body th,
        .md-body td {
            padding: 7px 12px;
            border: 1px solid var(--border);
        }

        .md-body th {
            background: var(--bg-soft);
            font-weight: 700;
        }

        .md-body tr:nth-child(2n) td {
            background: color-mix(in srgb, var(--bg-soft) 55%, transparent);
        }

        .md-body img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius);
        }

        .md-body hr {
            height: 1px;
            margin: 2em 0;
            border: 0;
            background: var(--border);
        }

        .md-body .task-list-item {
            list-style: none;
            margin-left: -1.3em;
        }

        .md-body input[type="checkbox"] {
            margin-right: .5em;
        }

        .md-body .anchor {
            margin-left: .35em;
            border: 0;
            font-size: .8em;
            color: var(--text-faint);
            opacity: 0;
            text-decoration: none;
            transition: opacity .15s;
        }

        .md-body h1:hover .anchor,
        .md-body h2:hover .anchor,
        .md-body h3:hover .anchor,
        .md-body h4:hover .anchor,
        .md-body .anchor:focus {
            opacity: 1;
        }

        .md-body .external::after {
            content: " ↗";
            font-size: .85em;
            color: var(--text-faint);
        }

        .md-body .asset-link::after {
            content: " ⤓";
            color: var(--text-faint);
        }

        .md-body .copy-code {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 3px 9px;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: var(--bg-elev);
            font-size: 12px;
            color: var(--text-soft);
            cursor: pointer;
            opacity: 0;
            transition: opacity .15s;
        }

        .md-body pre:hover .copy-code {
            opacity: 1;
        }

        .md-body mark {
            background: var(--mark);
            color: inherit;
        }

        /* ---------- 数学公式（KaTeX）---------- */
        .md-body .katex-wrap {
            display: inline-block;
            max-width: 100%;
            overflow-x: auto;
            overflow-y: hidden;
            vertical-align: baseline;
        }

        .md-body .katex-display,
        .md-body .katex-block {
            display: block;
            margin: 1.1em 0;
            padding: 4px 2px;
            overflow-x: auto;
            overflow-y: hidden;
        }

        .md-body .katex-display>.katex,
        .md-body .katex-block>.katex {
            text-align: center;
        }

        .md-body .katex {
            font-size: 1.05em;
        }

        .md-body .katex-block {
            font-size: 1.05em;
            text-align: center;
        }

        /* ---------- mermaid 图表 ---------- */
        .md-body .mermaid-figure {
            margin: 1.4em 0;
            padding: 14px 10px;
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            background: var(--bg-soft);
            overflow-x: auto;
            text-align: center;
        }

        .md-body .mermaid-figure svg {
            max-width: 100%;
            height: auto;
        }

        .md-body .mermaid-loading,
        .md-body .mermaid-failed {
            font-size: 13px;
            color: var(--text-faint);
        }

        .md-body .mermaid-failed {
            margin-top: 8px;
            padding: 8px 10px;
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            text-align: left;
            white-space: pre-wrap;
            color: var(--text-soft);
        }

        .md-body pre.mermaid-source {
            margin: 0;
            border: 0;
            background: transparent;
            text-align: left;
        }

        .md-body .flash {
            animation: flash-target 1.1s ease-out;
        }

        @keyframes flash-target {
            0% {
                background: var(--mark);
            }

            100% {
                background: transparent;
            }
        }

        /* 移动端遮罩 */
        .backdrop {
            position: fixed;
            inset: 54px 0 0;
            z-index: 20;
            background: rgba(16, 21, 27, .45);
            display: none;
        }

        @media (max-width: 1100px) {
            .toc {
                display: none;
            }
        }

        @media (max-width: 820px) {
            .layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .sidebar {
                position: fixed;
                top: 54px;
                left: 0;
                z-index: 25;
                width: min(84vw, var(--sidebar-w));
                box-shadow: var(--shadow);
                visibility: hidden;
                opacity: 0;
                transform: translateX(-12px);
                transition: opacity .18s, transform .18s, visibility .18s;
            }

            .layout.sidebar-open .sidebar {
                visibility: visible;
                opacity: 1;
                transform: none;
            }

            .layout.sidebar-open .backdrop {
                display: block;
            }

            .layout.sidebar-collapsed .sidebar {
                visibility: hidden;
            }

            .main {
                padding: 18px 16px 60px;
            }

            .doc-title {
                font-size: 22px;
            }

            .topbar .label {
                display: none;
            }
        }

        @media print {

            .topbar,
            .sidebar,
            .toc,
            .backdrop,
            .copy-code {
                display: none !important;
            }

            .layout {
                grid-template-columns: minmax(0, 1fr);
            }

            .main {
                padding: 0;
            }

            .md-body a {
                color: inherit;
                border: 0;
            }
        }
    </style>
</head>

<body>
    <header class="topbar">
        <button id="sidebar-toggle" class="icon-btn" type="button" aria-controls="sidebar" aria-expanded="true"
            title="显示 / 隐藏文档列表 (b)">☰</button>
        <span class="brand" id="brand">考研复习</span>
        <span class="spacer"></span>
        <button id="search-jump" class="icon-btn" type="button" title="搜索文档 (/)"><span>🔍</span><span
                class="label">搜索</span></button>
        <button id="reload-index" class="icon-btn" type="button" title="重新读取文档清单">
            <span>⟳</span><span class="label">刷新清单</span></button>
        <button id="print-doc" class="icon-btn" type="button" title="打印当前文档"><span>🖨</span><span
                class="label">打印</span></button>
    </header>

    <div class="layout" id="layout">
        <nav class="sidebar" id="sidebar" aria-label="文档列表">
            <div class="sidebar-inner">
                <div class="search-wrap" id="search-wrap">
                    <span class="icon">🔍</span>
                    <input id="search" type="search" placeholder="筛选文档…" autocomplete="off" spellcheck="false"
                        aria-label="筛选文档">
                    <button class="clear" id="search-clear" type="button" title="清空">✕</button>
                </div>
                <div id="doc-list" class="doc-list"></div>
                <div class="sidebar-foot" id="sidebar-foot"></div>
            </div>
        </nav>
        <div class="backdrop" id="backdrop"></div>

        <main class="main">
            <div class="article-wrap">
                <p class="breadcrumb" id="breadcrumb"></p>
                <h1 class="doc-title" id="doc-title">文档浏览</h1>
                <article class="md-body" id="content"></article>
            </div>
            <aside class="toc" id="toc" hidden aria-label="本文目录"></aside>
        </main>
    </div>

    <script>
        (function () {
            "use strict";

            /* =====================================================================
             * 配置：分组顺序、内置兜底清单
             * 分组名默认取顶层目录名；放在根目录的文档归入「其他资料」。
             * ===================================================================== */
            var CONFIG = {
                rootGroup: "其他资料",
                groupOrder: ["政治", "计算机", "数学", "英语", "其他资料"],
                // 部署时生成的 md-index.js 缺失时使用（例如用 file:// 直接打开页面）
                fallbackDocuments: [
                    "马原.md",
                    "毛中特.md",
                    "史纲.md",
                    "习思想.md",
                    "思想、道德、法治.md",
                    "数据结构31.md",
                    "计网28.md",
                    "计组28.md",
                    "操作系统16.md",
                    "数学概念.md",
                    "数学解法.md",
                    "QA.md"
                ]
            };

            /* ------------------------------ DOM ------------------------------ */
            var $ = function (id) { return document.getElementById(id); };
            var layout = $("layout");
            var contentEl = $("content");
            var titleEl = $("doc-title");
            var crumbEl = $("breadcrumb");
            var listEl = $("doc-list");
            var footEl = $("sidebar-foot");
            var tocEl = $("toc");
            var searchEl = $("search");
            var searchWrap = $("search-wrap");

            /* ------------------------------ 状态 ------------------------------ */
            var state = {
                documents: [],       // [{file, title, group, headings, words}]
                byFile: {},          // 规范化路径 -> 文档
                dirs: {},            // 已知目录名（小写），用于解析 /xxx 绝对路径
                meta: null,          // 清单元信息
                current: null,       // 当前文档路径
                lastMarkdown: null,  // 当前文档原文，主题切换时用于重渲染
                query: "",
                sidebarCollapsed: false
            };

            /* ============================ 工具函数 ============================ */

            function debounce(fn, wait) {
                var timer = null;
                return function () {
                    var args = arguments, self = this;
                    clearTimeout(timer);
                    timer = setTimeout(function () { fn.apply(self, args); }, wait);
                };
            }

            function escapeHtml(value) {
                return String(value === undefined || value === null ? "" : value)
                    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
            }

            function stripExt(file) { return file.replace(/\.(md|markdown)$/i, ""); }

            function groupOf(file) {
                var parts = file.split("/");
                return parts.length > 1 ? parts[0] : CONFIG.rootGroup;
            }

            function baseName(file) {
                var parts = file.split("/");
                return parts[parts.length - 1];
            }

            /** 去掉锚点/查询串、统一反斜杠；由调用方决定如何处理 . 与 .. */
            function normalizePath(value) {
                var raw = String(value || "").replace(/\\/g, "/").trim();
                var hashAt = raw.indexOf("#");
                if (hashAt >= 0) raw = raw.slice(0, hashAt);
                var queryAt = raw.indexOf("?");
                if (queryAt >= 0) raw = raw.slice(0, queryAt);
                var leading = /^\//.test(raw);
                var trailing = /\/$/.test(raw) && raw.length > 1;
                var out = [];
                raw.split("/").forEach(function (segment) {
                    if (!segment || segment === ".") return;
                    if (segment === "..") {
                        // 首部的 .. 要留给 resolveRelative 去抵消，否则会被吃掉层级
                        if (out.length && out[out.length - 1] !== "..") out.pop();
                        else if (!leading) out.push("..");
                        return;
                    }
                    out.push(segment);
                });
                return { path: out.join("/"), absolute: leading, directory: trailing };
            }

            /** 对每个路径段做百分号编码（中文文件名在部分环境下需要） */
            function encodePath(path) {
                return path.split("/").map(function (segment) {
                    return encodeURIComponent(segment);
                }).join("/");
            }

            /** 相对链接 -> 规范化路径；绝对链接要么命中已知文件，要么按仓库内路径处理 */
            function resolveHref(fromFile, target) {
                var target$ = normalizePath(target);
                if (!target$.path) return "";
                if (target$.absolute) {
                    var top = target$.path.split("/")[0].toLowerCase();
                    // 1) 清单里确实有这个文件（例如根目录的 /QA.md）
                    // 2) 第一段是已知目录（例如 /政治/史纲.md）
                    // 3) 文档本身在子目录里，此时绝对写法指的是仓库根
                    if (knownDocument(target$.path)) return target$.path;
                    if (state.dirs[top]) return target$.path;
                    if (!fromFile || fromFile.indexOf("/") < 0) return target$.path;
                    return resolveRelative(fromFile, target$.path);
                }
                return resolveRelative(fromFile, target$.path);
            }

            /** 清单里是否存在该路径（去掉编码差异） */
            function knownDocument(path) {
                if (state.byFile[path]) return true;
                var decoded = path;
                try { decoded = decodeURIComponent(path); } catch (error) { /* 非法编码 */ }
                if (state.byFile[decoded]) return true;
                var lower = decoded.toLowerCase();
                return Object.keys(state.byFile).some(function (key) {
                    return key.toLowerCase() === lower;
                });
            }

            /** 当前页面在站点里的目录，例如 https://user.github.io/repo/ -> "repo" */
            function locationBase() {
                if (typeof location === "undefined" || location.protocol === "file:") return "";
                return location.pathname.replace(/\/[^/]*$/, "").replace(/^\/|\/$/g, "");
            }

            /** 站点根/Pages 子路径的绝对链接，转成可用的相对地址 */
            function toSiteUrl(path) {
                var value = String(path || "");
                var base = locationBase();
                if (!base) return encodePath(value);
                var trimmed = value.replace(/^\/+/, "");
                if (trimmed === base || trimmed.indexOf(base + "/") === 0) return encodePath(trimmed);
                return encodePath(base + "/" + trimmed);
            }

            function resolveRelative(fromFile, rel) {
                var base = String(fromFile || "").split("/");
                base.pop(); // 去掉文件名，base 现在是所在目录
                rel.split("/").forEach(function (segment) {
                    if (segment === "." || segment === "") return;
                    if (segment === "..") { base.pop(); return; }
                    base.push(segment);
                });
                return base.join("/");
            }

            function resolveDocName(name) {
                if (state.byFile[name]) return name;
                var lower = name.toLowerCase();
                var hit = null;
                Object.keys(state.byFile).some(function (key) {
                    if (key.toLowerCase() !== lower) return false;
                    hit = key;
                    return true;
                });
                return hit;
            }

            /** 与 GitHub 一致的标题锚点：小写、去标点、空格转连字符 */
            function slugify(text) {
                return String(text)
                    .trim()
                    .toLowerCase()
                    .replace(/[\u2000-\u206f\u2e00-\u2e7f\\'!"#$%&()*+,./:;<=>?@\[\]^`{|}~]/g, "")
                    .replace(/\s+/g, "-");
            }

            /** 更宽松的匹配键，用于容忍手写锚点的细微差异 */
            function looseKey(text) {
                return String(text)
                    .toLowerCase()
                    .replace(/[\s\-_.·]+/g, "")
                    .replace(/[\u2000-\u206f\u2e00-\u2e7f\\'!"#$%&()*+,./:;<=>?@\[\]^`{|}~]/g, "");
            }

            function stripTags(html) {
                var div = document.createElement("div");

            function highlight(text, query) {
                var safe = escapeHtml(text);
                if (!query) return safe;
                var needle = escapeHtml(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
                try {
                    return safe.replace(new RegExp(needle, "gi"), function (hit) {
                        return "<mark>" + hit + "</mark>";
                    });
                } catch (error) {
                    return safe;
                }
            }

            function formatCount(value) {
                return String(value || 0);
            }

            function rawUrl(file) {
                var meta = state.meta || {};
                if (!meta.owner || !meta.repo) return "";
                return "https://raw.githubusercontent.com/" + meta.owner + "/" + meta.repo + "/" +
                    (meta.branch || "main") + "/" + encodePath(file);
            }

            /* ============================ 清单处理 ============================ */

            function normalizeManifest(raw) {
                var documents = [];
                var dirs = {};
                if (raw && Array.isArray(raw.documents)) {
                    raw.documents.forEach(function (item) {
                        if (typeof item === "string") item = { file: item };
                        if (!item || !item.file) return;
                        var info = normalizePath(item.file);
                        if (!info.path || !/\.(md|markdown)$/i.test(info.path)) return;
                        documents.push({
                            file: info.path,
                            title: item.title || stripExt(baseName(info.path)),
                            heading: item.heading || "",
                            headings: Array.isArray(item.headings) ? item.headings : [],
                            words: item.words || 0
                        });
                    });
                    (raw.dirs || []).forEach(function (dir) { dirs[String(dir).toLowerCase()] = true; });
                }
                if (raw && Array.isArray(raw.files) && !documents.length) {
                    raw.files.forEach(function (file) {
                        var info = normalizePath(file);
                        if (!info.path) return;
                        documents.push({ file: info.path, title: stripExt(baseName(info.path)), headings: [], words: 0 });
                    });
                }
                var seen = {};
                documents = documents.filter(function (doc) {
                    if (seen[doc.file]) return false;
                    seen[doc.file] = true;
                    return true;
                });
                documents.forEach(function (doc) {
                    doc.group = groupOf(doc.file);
                    dirs[doc.group.toLowerCase()] = true;
                });

            function applyManifest(raw) {

                var documents = normalized.documents;
                var meta = normalized.meta;
                if (!documents.length) {
                    documents = CONFIG.fallbackDocuments.map(function (file) {
                        return {
                            file: file,
                            title: stripExt(baseName(file)),
                            heading: "",
                            headings: [],
                            words: 0,
                            group: groupOf(file)
                        };
                    });
                    documents.forEach(function (doc) { normalized.dirs[doc.group.toLowerCase()] = true; });
                    meta = { name: "考研复习（内置清单）", generatedAt: null };
                }
                state.documents = documents;
                state.meta = meta;
                state.dirs = normalized.dirs;
                state.byFile = {};
                documents.forEach(function (doc) { state.byFile[doc.file] = doc; });
                if (meta && meta.name) $("brand").textContent = meta.name;
            }

            /** 清单缺失或过期时，尝试直接向 GitHub API 要一份目录树 */
            function discoverViaGitHubApi() {
                if (location.protocol === "file:") return Promise.resolve(null);
                var host = location.hostname;
                if (!/(^|\.)github\.io$/i.test(host) && !/(^|\.)githubusercontent\.com$/i.test(host)) {
                    return Promise.resolve(null);
                }
                var segments = location.pathname.split("/").filter(Boolean);
                var owner = host.split(".")[0];
                var repo = segments[0] || (owner + ".github.io");
                var base = repo.toLowerCase() === (owner + ".github.io").toLowerCase() ? "" : repo;
                var meta = state.meta || {};
                if (meta.owner && meta.repo) {
                    owner = meta.owner;
                    repo = meta.repo;
                    base = String(meta.base || "/").replace(/^\/|\/$/g, "");
                }
                var prefix = base ? base + "/" : "";
                var branch = (meta.branch || "main");
                var url = "https://api.github.com/repos/" + owner + "/" + repo +
                    "/git/trees/" + encodeURIComponent(branch) + "?recursive=1";
                return fetch(url, { headers: { Accept: "application/vnd.github+json" } })
                    .then(function (response) {
                        if (!response.ok) throw new Error("GitHub API " + response.status);
                        return response.json();
                    })
                    .then(function (data) {
                        if (!data || !Array.isArray(data.tree)) return null;
                        var found = [];
                        data.tree.forEach(function (node) {
                            if (!node || node.type !== "blob") return;
                            var file = node.path;
                            if (prefix && file.indexOf(prefix) !== 0) return;
                            if (prefix) file = file.slice(prefix.length);
                            if (!/\.(md|markdown)$/i.test(file)) return;
                            if (file.split("/").length > 1 && /^(more|node_modules|\.github)\//i.test(file)) return;
                            found.push({ file: file, title: stripExt(baseName(file)) });
                        });
                        if (!found.length) return null;
                        return {
                            name: (meta.name || repo),
                            source: "github-api",
                            owner: owner,
                            repo: repo,
                            branch: branch,
                            base: "/" + (base ? base + "/" : ""),
                            documents: found
                        };
                    })
                    .catch(function (error) {
                        console.warn("[md-browse] GitHub API 列目录失败：", error.message);
                        return null;
                    });
            }

            /* ============================ 侧边栏 ============================ */

            function groupRank(name) {
                var index = CONFIG.groupOrder.indexOf(name);
                return index >= 0 ? index : CONFIG.groupOrder.length;
            }

            function renderList() {
                var query = state.query.trim().toLowerCase();
                var matched = state.documents.filter(function (doc) {
                    if (!query) return true;
                    if (doc.title.toLowerCase().indexOf(query) >= 0) return true;
                    if (doc.file.toLowerCase().indexOf(query) >= 0) return true;
                    return doc.headings.some(function (heading) {
                        return heading.text && heading.text.toLowerCase().indexOf(query) >= 0;
                    });
                });

                if (!matched.length) {
                    listEl.innerHTML = '<p class="empty">没有匹配 <mark>' + escapeHtml(state.query) +
                        '</mark> 的文档</p>';
                    renderFoot(matched.length);
                    return;
                }

                var groups = {};
                matched.forEach(function (doc) {
                    (groups[doc.group] = groups[doc.group] || []).push(doc);
                });

                var names = Object.keys(groups).sort(function (a, b) {
                    return groupRank(a) - groupRank(b) || a.localeCompare(b, "zh-Hans-CN");
                });

                var html = names.map(function (name) {
                    var items = groups[name].map(function (doc) {
                        var active = doc.file === state.current ? " active" : "";
                        var tip = doc.file + (doc.heading ? "\n首个标题：" + doc.heading : "");
                        var meta = [];
                        if (doc.words) meta.push("约 " + formatCount(doc.words) + " 字");
                        if (doc.file.indexOf("/") >= 0) meta.push(baseName(doc.file));
                        return '<button type="button" class="doc-link' + active + '" data-file="' +
                            escapeHtml(doc.file) + '" title="' + escapeHtml(tip) + '">' +
                            '<span class="name">' + highlight(doc.title, state.query.trim()) + "</span>" +
                            (meta.length ? '<span class="meta">' + escapeHtml(meta.join(" · ")) + "</span>" : "") +
                            "</button>";
                    }).join("");
                    return '<section class="group"><h2><span>' + escapeHtml(name) + "</span><span>" +
                        groups[name].length + "</span></h2>" + items + "</section>";
                }).join("");

                listEl.innerHTML = html;
                renderFoot(matched.length);
            }

            function renderFoot(matched) {
                var meta = state.meta || {};
                var lines = [];
                lines.push("共 " + state.documents.length + " 篇" +
                    (matched !== undefined ? "（筛选出 " + matched + " 篇）" : ""));
                if (meta.generatedAt) {
                    lines.push("清单生成于 " + escapeHtml(String(meta.generatedAt).replace("T", " ").slice(0, 16)));
                } else if (state.documents.length && !meta.generatedAt) {
                    lines.push('使用内置清单（部署后由工作流生成 <code>md-index.js</code>）');
                }
                if (meta.owner && meta.repo) {
                    lines.push('<a href="https://github.com/' + escapeHtml(meta.owner) + "/" + escapeHtml(meta.repo) +
                        '" target="_blank" rel="noopener">仓库</a>');
                }
                footEl.innerHTML = lines.join("<br>");
            }

            function markActive() {
                var buttons = listEl.querySelectorAll(".doc-link");
                Array.prototype.forEach.call(buttons, function (button) {
                    button.classList.toggle("active", button.getAttribute("data-file") === state.current);
                });
            }

            /* ============================ 路由 ============================ */

            function parseHash() {
                var raw = String(location.hash || "").replace(/^#/, "");
                if (!raw) return {};
                if (/^(?:doc|file|h|anchor)=/.test(raw)) {
                    var params = new URLSearchParams(raw);
                    var doc = params.get("doc") || params.get("file") || "";
                    return {
                        doc: doc,
                        anchor: params.get("h") || params.get("anchor") || "",
                        key: raw
                    };
                }
                var split = raw.split("&").map(function (part) { return part.trim(); }).filter(Boolean);
                var first = split[0] || "";
                var rest = split.slice(1);
                if (!/\.(md|markdown)$/i.test(first) && !state.byFile[first] && rest.length) {
                    return { doc: rest.join("&"), anchor: first, key: raw };
                }
                return { doc: first, anchor: rest.join("&"), key: raw };
            }

            function hashFor(file, anchor) {
                var value = "doc=" + encodeURIComponent(file);

            }

                if (location.hash === next) return;
                if (history && history.pushState) history.pushState(null, "", next);

            /* ============================ Markdown 渲染 ============================ */

            function decodeEntities(html) {
                var textarea = document.createElement("textarea");
                textarea.innerHTML = html;
                return textarea.value;
            }

            /*
             * 数学公式：注册成 marked 扩展，而不是解析完再扫描 DOM。
             * 这样公式在标记化阶段就被整段取出，里面的 _ * [ ] \ 不会被当成
             * Markdown 语法，也不会因为 breaks:true 被 <br> 打断。
             */
            var MATH_OPENERS = /\$|\\\(|\\\[/;

            /** $ 或 $$ 包裹的数学；用内容特征把 `$5 和 $6` 这类货币文本排除掉 */
            function matchInlineMath(src) {
                var pairs = [
                    { open: 2, close: "$$" },
                    { open: 1, close: "$" }
                ];
                for (var i = 0; i < pairs.length; i += 1) {
                    var pair = pairs[i];
                    if (src.slice(0, pair.open) !== new Array(pair.open + 1).join("$")) continue;
                    if (pair.open === 1 && src.slice(0, 2) === "$$") continue;
                    var end = src.indexOf(pair.close, pair.open);
                    if (end < 0) continue;
                    var content = src.slice(pair.open, end);
                    var trimmed = content.replace(/^\s+/, "").replace(/\s+$/, "");
                    if (!trimmed) continue;
                    var latex = trimmed.indexOf("\\") >= 0;
                    // `$ x$`：前导空白且没有 LaTeX 特征
                    if (/^\s/.test(content) && !latex) continue;
                    // `$5 和 $6`：尾随空白且没有 LaTeX 特征
                    if (/\s$/.test(content) && !latex) continue;
                    // 收尾符后紧跟数字，同样按普通文本处理
                    if (/[0-9]/.test(src.charAt(end + pair.close.length))) continue;
                    return {
                        raw: src.slice(0, end + pair.close.length),
                        text: trimmed,
                        display: pair.open === 2

                return null;
            }

            function mathHtml(text, display) {
                var tag = display ? "div" : "span";
                var attribute = display
                    ? ' class="katex-block" data-display="1"'
                    : ' class="katex-wrap" data-display="0"';

            function createMathExtension() {
                return {
                    extensions: [
                        {
                            name: "inlineMath",
                            level: "inline",
                            // marked 传入的是 src.slice(1)，返回值按下标使用，不要再做偏移
                            start: function (src) {
                                var index = src.search(MATH_OPENERS);
                                return index < 0 ? undefined : index;
                            },
                            tokenizer: function (src) {
                                if (src.charAt(0) === "$") {
                                    var hit = matchInlineMath(src);
                                    if (hit) {
                                        return {
                                            type: "inlineMath",
                                            raw: hit.raw,
                                            text: hit.text,
                                            display: hit.display
                                        };
                                    }
                                }
                                var pairs = [
                                    { open: "\\[", close: "\\]", display: true },
                                    { open: "\\(", close: "\\)", display: false }
                                ];
                                for (var i = 0; i < pairs.length; i += 1) {
                                    var pair = pairs[i];
                                    if (src.slice(0, pair.open.length) !== pair.open) continue;
                                    var end = src.indexOf(pair.close, pair.open.length);
                                    if (end < 0) continue;
                                    var content = src.slice(pair.open.length, end).replace(/^\s+|\s+$/g, "");
                                    if (!content) continue;
                                    return {
                                        type: "inlineMath",
                                        raw: src.slice(0, end + pair.close.length),
                                        text: content,
                                        display: pair.display
                                    };
                                }

                            renderer: function (token) { return mathHtml(token.text, token.display); }
                        },
                        {
                            name: "blockMath",
                            level: "block",
                            tokenizer: function (src) {
                                var pairs = [
                                    { open: "$$", close: "$$" },
                                    { open: "\\[", close: "\\]" }
                                ];
                                for (var i = 0; i < pairs.length; i += 1) {
                                    var pair = pairs[i];
                                    if (src.slice(0, pair.open.length) !== pair.open) continue;
                                    var end = src.indexOf(pair.close, pair.open.length);
                                    if (end < 0) continue;
                                    var raw = src.slice(0, end + pair.close.length);
                                    var content = src.slice(pair.open.length, end)
                                        .replace(/^\s*\n/, "").replace(/\n\s*$/, "");
                                    if (!content.replace(/\s+/g, "")) continue;
                                    return { type: "blockMath", raw: raw, text: content };
                                }
                                return undefined;
                            },
                            renderer: function (token) { return mathHtml(token.text, true); }
                        }
                    ]

            }

            var markedInstance = null;

            function getMarked() {
                if (markedInstance) return markedInstance;
                var API = window.marked;

                    if (typeof Ctor === "function") {

                        markedInstance = instance;
